# Onderwerp

Ik ben iemand die zijn nationaliteit, geschiedenis en identiteit heel hoog heeft staan in zijn leven.
Het is iets waar ik mee ben opgegroeid en voor altijd in mij zal bestaan. Van vlaggen, naar identiteiten, naar regio's, naar kunst, naar calligrafie,
naar portretten en schilderijen, naar architectuur, tot moskeën en nog tientallen dingen die allemaal apart iets betekenen voor mij.
Ik kon niks anders kiezen dan de het rijk der rijken; Devlet-i Aliyye

# Reflectie

Het is obvious dat alle patronen en elementen enigzins bij elkaar aansluiten. Bijvoorbeeld met de kleuren, waarin vooral gebruik wordt
van sterke en donkere kleuren. Er worden veel motieven gebruikt, waaronder bloemen zoals rozen, maar ook de perzische kunst.
Over het algemeen geeft het gewoon een heel classy en indrukwekkende vibe, en komt het gewoon heel powerful over.
